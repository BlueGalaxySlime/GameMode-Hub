name: Build SteamHub

on:
  push:
    branches:
      - main
      - feat/initial-foundation
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build Decky frontend
        run: npm run build
      - name: Check Python syntax
        run: python3 -m py_compile main.py tab_manager.py
      - name: Test backend
        run: python3 -m unittest discover -s tests -v
      - name: Test TabMaster activation detection
        run: node --test tests/tabmaster-detection.test.cjs
      - name: Test update checker timeouts
        run: node --test tests/update-timeout.test.cjs
      - name: Create Decky plugin ZIP
        run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: SteamHub-build
          path: release/SteamHub.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck && npm run build && python3 scripts/package.py
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; refusing to overwrite."
            exit 0
          fi
          gh release create "$VERSION" release/SteamHub.zip --target "$GITHUB_SHA" \
            --title "SteamHub $VERSION" --notes-file docs/RELEASE_NOTES.md
