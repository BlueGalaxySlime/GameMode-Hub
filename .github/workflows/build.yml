name: Build GameMode Hub

on:
  push:
    branches:
      - main
      - feat/initial-foundation
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: gamemodehub-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build Decky frontend
        run: npm run build
      - name: Check Python syntax
        run: python3 -m py_compile main.py hub_settings.py release_catalog.py file_manager.py desktop_apps.py terminal_core/*.py
      - name: Test backend
        run: python3 -m unittest discover -s tests -v
      - name: Verify channel classification and downgrade safeguards
        run: node --test tests/release-catalog.test.cjs
      - name: Test TabMaster activation detection
        run: node --test tests/tabmaster-detection.test.cjs
      - name: Test update checker timeouts
        run: node --test tests/update-timeout.test.cjs
      - name: Verify terminal safe mode
        run: node --test tests/terminal-safe-mode.test.cjs
      - name: Verify session preservation and options
        run: node --test tests/hub-session.test.cjs
      - name: Verify file manager layout and path navigation
        run: node --test tests/file-manager-layout.test.cjs
      - name: Verify Desktop Apps-style launcher with Files UI
        run: node --test tests/desktop-apps-layout.test.cjs
      - name: Verify plugin identity
        run: node --test tests/gamemode-identity.test.cjs
      - name: Create Decky plugin ZIP
        run: python3 scripts/package.py
      - name: Verify ZIP identity and safe contents
        run: python3 tests/check_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: GameMode-Hub-build
          path: release/GameMode-Hub.zip
          if-no-files-found: error


  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck && npm run build && python3 scripts/package.py
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          grep -Fq "CURRENT_VERSION = \"${VERSION#v}\"" main.py || { echo "Backend version mismatch"; exit 1; }
          grep -q "const VERSION = \"${VERSION#v}\"" src/hub/UpdaterPage.tsx || { echo "Frontend version mismatch"; exit 1; }
          HEAD_SHA="$(gh api repos/$GITHUB_REPOSITORY/branches/main --jq .commit.sha)"
          if [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
            echo "Skipping outdated build $GITHUB_SHA (main is $HEAD_SHA)."
            exit 0
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; refusing to overwrite."
            exit 0
          fi
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Use only numeric release tags, without channel suffix"; exit 1; }
          sha256sum release/GameMode-Hub.zip > SHA256SUMS.txt
          gh release create "$VERSION" release/GameMode-Hub.zip SHA256SUMS.txt --prerelease --target "$GITHUB_SHA" \
            --title "GameMode Hub $VERSION" --notes-file docs/RELEASE_NOTES.md
