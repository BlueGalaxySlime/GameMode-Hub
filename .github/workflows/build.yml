name: Build SteamOS-Hub preview

on:
  push:
    branches:
      - main
      - feat/initial-foundation
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build Decky frontend
        run: npm run build
      - name: Check Python syntax
        run: python3 -m py_compile main.py
      - name: Create Decky plugin ZIP
        run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: SteamOS-Hub-preview
          path: release/SteamOS-Hub.zip
          if-no-files-found: error
